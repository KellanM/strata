<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#030203">
  <meta name="robots" content="noindex">
  <title>Strata · cave mural spike</title>
  <script type="importmap">
    { "imports": { "three": "../vendor/three/build/three.module.min.js" } }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #030203; overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .layer { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      padding-bottom: calc(18vh + env(safe-area-inset-bottom)); transition: opacity 0.9s ease; }
    .layer[hidden] { display: flex; opacity: 0; pointer-events: none; }
    .ember { width: 10px; height: 10px; border-radius: 50%; background: #ffcf8a;
      box-shadow: 0 0 10px 4px rgba(255, 160, 70, 0.55), 0 0 40px 16px rgba(255, 120, 40, 0.18);
      animation: breathe 2.6s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: scale(0.75); opacity: 0.7; } }
    .label { margin-top: 26px; font: 500 11px/1 "Avenir Next", Futura, "Century Gothic", "Segoe UI", sans-serif;
      letter-spacing: 0.42em; text-transform: lowercase; color: rgba(255, 226, 190, 0.5); padding-left: 0.42em; }
    #skip { justify-content: flex-start; align-items: flex-end; padding: calc(18px + env(safe-area-inset-top)) 20px 0 0; pointer-events: none; }
    #skip .label { margin: 0; color: rgba(255, 226, 190, 0.28); font-size: 10px; }
    #replay { width: 54px; height: 54px; border-radius: 50%; border: 1px solid rgba(255, 214, 160, 0.35); background: transparent;
      display: grid; place-items: center; cursor: pointer; padding: 0; }
    #replay svg { width: 22px; height: 22px; stroke: rgba(255, 220, 170, 0.8); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    #perf { position: fixed; left: 8px; bottom: 8px; font: 11px monospace; color: #9a8; pointer-events: none; }
  </style>
</head>
<body>
  <!-- A throwaway spike: the backstory as a lantern-lit cave mural. Not linked from the game. -->
  <canvas id="cave"></canvas>
  <div id="gate" class="layer" hidden><div class="ember"></div><p class="label">tap</p></div>
  <div id="skip" class="layer" hidden><p class="label">tap to skip</p></div>
  <div id="end" class="layer" hidden>
    <button id="replay" aria-label="Replay"><svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v3.2h3.2"/></svg></button>
  </div>
  <div id="perf"></div>
  <script type="module" src="cave/main.js?v=2"></script>
</body>
</html>
